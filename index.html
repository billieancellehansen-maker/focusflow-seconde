<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow Seconde</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 980px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      color: #38bdf8;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      color: #93c5fd;
      margin-top: 0;
    }

    .box {
      background: #1e293b;
      border-radius: 14px;
      padding: 24px;
      margin-top: 20px;
    }

    .button {
      display: inline-block;
      margin: 8px 8px 0 0;
      padding: 12px 18px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .button.choice {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 10px;
    }

    .secondary {
      background: #64748b;
      color: white;
    }

    .danger {
      background: #f59e0b;
      color: #0f172a;
    }

    .success {
      background: #22c55e;
      color: #0f172a;
    }

    .score {
      color: #38bdf8;
      font-weight: bold;
      font-size: 22px;
    }

    .small {
      color: #cbd5e1;
      font-size: 14px;
    }

    #app {
      margin-top: 20px;
    }

    .reward-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: white;
      border: 2px solid #facc15;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      background: #facc15;
      color: #0f172a;
      font-size: 18px;
    }

    .hint-box {
      background: #0f3b50;
      border: 2px dashed #38bdf8;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      color: #dbeafe;
    }

    .game-info {
      margin: 15px 0;
      font-size: 18px;
      color: #f8fafc;
    }

    canvas {
      background: #0b1220;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      display: block;
      margin-top: 20px;
    }

    .coin {
      color: #facc15;
      font-weight: bold;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .pill {
      background: #0f3b50;
      border-radius: 999px;
      padding: 10px 14px;
      color: white;
      font-weight: bold;
    }

    ul {
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FocusFlow Seconde</h1>
    <p>Application de révision niveau seconde avec mini-jeu bonus.</p>

    <div class="box">
      <h2>Présentation</h2>
      <p>
        Réponds au quiz, débloque le jeu serpent si tu obtiens au moins 5/10,
        puis collecte des pièces pour gagner des aides.
      </p>
    </div>

    <div id="app" class="box"></div>

    <div class="box">
      <h2>Voir le code</h2>
      <p>
        <a class="button" href="https://github.com/billieancellehansen-maker/focusflow-seconde" target="_blank">
          Voir le code sur GitHub
        </a>
      </p>
    </div>

    <div class="box">
      <h2>Auteur</h2>
      <p>Billie</p>
    </div>
  </div>

  <script>
    const quizData = {
      "Maths": [
        { question: "Quelle est la forme d’une fonction cube ?", choices: ["f(x)=x³", "f(x)=x²", "f(x)=2x"], answer: "f(x)=x³" },
        { question: "Quelle est l’image de 2 par la fonction cube ?", choices: ["4", "6", "8"], answer: "8" },
        { question: "Quelle est l’image de -3 par la fonction cube ?", choices: ["-27", "-9", "9"], answer: "-27" },
        { question: "Quelle est la forme d’une fonction carré ?", choices: ["f(x)=x²", "f(x)=x³", "f(x)=1/x"], answer: "f(x)=x²" },
        { question: "Quelle est l’image de -4 par la fonction carré ?", choices: ["-16", "16", "8"], answer: "16" },
        { question: "Comment s’appelle la courbe d’une fonction carré ?", choices: ["Parabole", "Droite", "Cercle"], answer: "Parabole" },
        { question: "Quelle est la formule de l’aire d’un carré de côté c ?", choices: ["c²", "4c", "c³"], answer: "c²" },
        { question: "Quelle est la formule du volume d’un cube de côté c ?", choices: ["c³", "c²", "6c"], answer: "c³" },
        { question: "Combien de côtés a un triangle ?", choices: ["3", "4", "5"], answer: "3" },
        { question: "Quelle est la somme des angles d’un triangle ?", choices: ["180°", "90°", "360°"], answer: "180°" }
      ],

      "Français": [
        { question: "La poésie appartient à quel domaine ?", choices: ["La littérature", "La géométrie", "La physique"], answer: "La littérature" },
        { question: "Un vers de 12 syllabes s’appelle :", choices: ["Un alexandrin", "Un octosyllabe", "Un sonnet"], answer: "Un alexandrin" },
        { question: "Un sonnet contient combien de vers ?", choices: ["10", "12", "14"], answer: "14" },
        { question: "Une didascalie sert à :", choices: ["Donner des indications de jeu", "Raconter la fin", "Décrire une figure"], answer: "Donner des indications de jeu" },
        { question: "Quand un personnage parle seul sur scène, c’est :", choices: ["Un monologue", "Un dialogue", "Une strophe"], answer: "Un monologue" },
        { question: "Une métaphore est :", choices: ["Une comparaison sans outil", "Une répétition", "Une date"], answer: "Une comparaison sans outil" },
        { question: "Le théâtre est d’abord conçu pour :", choices: ["Être joué sur scène", "Être calculé", "Être mesuré"], answer: "Être joué sur scène" },
        { question: "La littérature permet surtout de :", choices: ["Exprimer des idées et des émotions", "Mesurer une distance", "Tracer une figure"], answer: "Exprimer des idées et des émotions" },
        { question: "Des sons qui se répètent en fin de vers sont :", choices: ["Des rimes", "Des angles", "Des didascalies"], answer: "Des rimes" },
        { question: "Une scène appartient au genre :", choices: ["Théâtral", "Scientifique", "Mathématique"], answer: "Théâtral" }
      ],

      "Histoire-Géo-EMC": [
        { question: "En quelle année commence la Révolution française ?", choices: ["1789", "1815", "1492"], answer: "1789" },
        { question: "La France est aujourd’hui une :", choices: ["République", "Monarchie absolue", "Empire"], answer: "République" },
        { question: "Quelle est la capitale de la France ?", choices: ["Paris", "Lyon", "Marseille"], answer: "Paris" },
        { question: "Un citoyen possède :", choices: ["Des droits et des devoirs", "Seulement des devoirs", "Aucun droit"], answer: "Des droits et des devoirs" },
        { question: "Qui peut voter en France ?", choices: ["Les citoyens majeurs", "Les touristes", "Tous les enfants"], answer: "Les citoyens majeurs" },
        { question: "L’Europe est :", choices: ["Un continent", "Un pays", "Une ville"], answer: "Un continent" },
        { question: "Le climat dépend notamment de :", choices: ["La latitude", "Le prénom", "Le téléphone"], answer: "La latitude" },
        { question: "Le développement durable consiste à :", choices: ["Protéger les ressources pour l’avenir", "Polluer davantage", "Supprimer les lois"], answer: "Protéger les ressources pour l’avenir" },
        { question: "Le maire dirige :", choices: ["Une commune", "Un continent", "Un océan"], answer: "Une commune" },
        { question: "La liberté signifie surtout :", choices: ["Pouvoir faire des choix dans le respect des lois", "Faire n’importe quoi", "Ne jamais obéir"], answer: "Pouvoir faire des choix dans le respect des lois" }
      ]
    };

    let selectedSubject = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let hintTokens = 0;
    let currentChoices = [];
    let gameUnlocked = false;

    const app = document.getElementById("app");

    function showHome() {
      app.innerHTML = `
        <h2>Bienvenue</h2>
        <div class="topbar">
          <div class="pill">💡 Aides : ${hintTokens}</div>
          <div class="pill">🎮 Jeu serpent : ${gameUnlocked ? "débloqué" : "bloqué"}</div>
        </div>
        <p>Choisis une matière pour commencer ton quiz.</p>
        <button class="button" onclick="startQuiz('Maths')">Maths</button>
        <button class="button" onclick="startQuiz('Français')">Français</button>
        <button class="button" onclick="startQuiz('Histoire-Géo-EMC')">Histoire-Géo-EMC</button>
        ${gameUnlocked ? `<button class="button success" onclick="showSnakeGame()">Jouer au serpent</button>` : ""}
      `;
    }

    function startQuiz(subject) {
      selectedSubject = subject;
      currentQuestionIndex = 0;
      score = 0;
      prepareQuestion();
      showQuestion();
    }

    function prepareQuestion() {
      const q = quizData[selectedSubject][currentQuestionIndex];
      currentChoices = [...q.choices];
    }

    function showQuestion() {
      const questions = quizData[selectedSubject];
      const q = questions[currentQuestionIndex];

      let choicesHtml = "";
      currentChoices.forEach(choice => {
        const safeChoice = choice.replace(/'/g, "\\'");
        choicesHtml += `
          <button class="button choice" onclick="checkAnswer('${safeChoice}')">${choice}</button>
        `;
      });

      app.innerHTML = `
        <h2>${selectedSubject}</h2>
        <div class="topbar">
          <div class="pill">Question ${currentQuestionIndex + 1} / ${questions.length}</div>
          <div class="pill">Score : ${score}</div>
          <div class="pill">💡 Aides : ${hintTokens}</div>
        </div>
        <p><strong>${q.question}</strong></p>
        ${choicesHtml}
        <button class="button secondary" onclick="showHome()">Retour</button>
        ${hintTokens > 0 ? `<button class="button danger" onclick="useHint()">Utiliser une aide</button>` : ""}
      `;
    }

    function useHint() {
      const q = quizData[selectedSubject][currentQuestionIndex];

      if (hintTokens <= 0) return;
      if (currentChoices.length <= 2) return;

      const wrongChoices = currentChoices.filter(choice => choice !== q.answer);
      if (wrongChoices.length === 0) return;

      const toRemove = wrongChoices[Math.floor(Math.random() * wrongChoices.length)];
      currentChoices = currentChoices.filter(choice => choice !== toRemove);
      hintTokens--;

      showQuestion();
    }

    function checkAnswer(choice) {
      const questions = quizData[selectedSubject];
      const q = questions[currentQuestionIndex];

      let message = "";
      if (choice === q.answer) {
        score++;
        message = "✅ Bonne réponse !";
      } else {
        message = `❌ Mauvaise réponse. La bonne réponse était : ${q.answer}`;
      }

      app.innerHTML = `
        <h2>${selectedSubject}</h2>
        <p class="score">Score : ${score}</p>
        <p>${message}</p>
        <button class="button" onclick="nextQuestion()">Question suivante</button>
      `;
    }

    function nextQuestion() {
      currentQuestionIndex++;
      const questions = quizData[selectedSubject];

      if (currentQuestionIndex < questions.length) {
        prepareQuestion();
        showQuestion();
      } else {
        showResult();
      }
    }

    function getRewardHtml(total, score) {
      if (score < 5) {
        return `
          <p>💪 Continue, tu vas progresser !</p>
          <p class="small">Tu n’as pas débloqué le mini-jeu cette fois.</p>
        `;
      }

      gameUnlocked = true;

      if (score >= 5 && score <= 7) {
        return `
          <div class="reward-box">
            <h3>🎁 Surprise débloquée</h3>
            <p>Tu as réussi assez de questions pour débloquer le mini-jeu serpent.</p>
            <div class="badge">Badge Réviseuse</div>
            <p class="small">Dans le jeu, 10 pièces = 1 aide pour le quiz.</p>
            <button class="button success" onclick="showSnakeGame()">Jouer au serpent</button>
          </div>
        `;
      }

      if (score >= 8 && score <= 9) {
        return `
          <div class="reward-box">
            <h3>🌟 Surprise débloquée</h3>
            <p>Excellent score ! Tu débloques le mini-jeu serpent.</p>
            <div class="badge">Badge Championne</div>
            <p class="small">Dans le jeu, 10 pièces = 1 aide pour le quiz.</p>
            <button class="button success" onclick="showSnakeGame()">Jouer au serpent</button>
          </div>
        `;
      }

      return `
        <div class="reward-box">
          <h3>👑 Surprise ultime</h3>
          <p>Sans faute ! Tu débloques le mini-jeu serpent en mode championne.</p>
          <div class="badge">Badge Championne Play</div>
          <p class="small">Dans le jeu, 10 pièces = 1 aide pour le quiz.</p>
          <button class="button success" onclick="showSnakeGame()">Jouer au serpent</button>
        </div>
      `;
    }

    function showResult() {
      const total = quizData[selectedSubject].length;
      let finalMessage = "";

      if (score === total) {
        finalMessage = "🏆 Incroyable ! Sans faute !";
      } else if (score >= 8) {
        finalMessage = "🎉 Très bon travail !";
      } else if (score >= 5) {
        finalMessage = "👍 Bon travail !";
      } else {
        finalMessage = "💪 Continue !";
      }

      const rewardHtml = getRewardHtml(total, score);

      app.innerHTML = `
        <h2>Quiz terminé</h2>
        <p class="score">Tu as obtenu ${score} / ${total}</p>
        <p>${finalMessage}</p>
        ${rewardHtml}
        <button class="button" onclick="showHome()">Retour à l’accueil</button>
      `;
    }

    function showSnakeGame() {
      app.innerHTML = `
        <h2>Mini-jeu serpent</h2>
        <p>Déplace le serpent avec les flèches du clavier.</p>
        <p class="game-info">🪙 Pièces gagnées dans cette partie : <span id="coins" class="coin">0</span></p>
        <p class="game-info">💡 Aides disponibles : <span id="hints">${hintTokens}</span></p>
        <p class="small">Toutes les 10 pièces, tu gagnes 1 aide pour supprimer une mauvaise réponse dans le quiz.</p>
        <canvas id="gameCanvas" width="420" height="420"></canvas>
        <br>
        <button class="button secondary" onclick="showHome()">Retour à l’accueil</button>
        <button class="button" onclick="showSnakeGame()">Rejouer</button>
      `;

      startSnake();
    }

    function startSnake() {
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const box = 20;

      let snake = [{ x: 10 * box, y: 10 * box }];
      let direction = "RIGHT";
      let coin = randomPosition();
      let coinsCollected = 0;

      function randomPosition() {
        return {
          x: Math.floor(Math.random() * 21) * box,
          y: Math.floor(Math.random() * 21) * box
        };
      }

      function drawBackground() {
        ctx.fillStyle = "#0b1220";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawSnake() {
        for (let i = 0; i < snake.length; i++) {
          ctx.fillStyle = i === 0 ? "#22c55e" : "#86efac";
          ctx.fillRect(snake[i].x, snake[i].y, box - 2, box - 2);
        }
      }

      function drawCoin() {
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(coin.x + box / 2, coin.y + box / 2, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      function updateInfo() {
        document.getElementById("coins").textContent = coinsCollected;
        document.getElementById("hints").textContent = hintTokens;
      }

      function collision(head, array) {
        for (let i = 0; i < array.length; i++) {
          if (head.x === array[i].x && head.y === array[i].y) {
            return true;
          }
        }
        return false;
      }

      function moveSnake() {
        let headX = snake[0].x;
        let headY = snake[0].y;

        if (direction === "LEFT") headX -= box;
        if (direction === "UP") headY -= box;
        if (direction === "RIGHT") headX += box;
        if (direction === "DOWN") headY += box;

        if (
          headX < 0 ||
          headY < 0 ||
          headX >= canvas.width ||
          headY >= canvas.height ||
          collision({ x: headX, y: headY }, snake)
        ) {
          clearInterval(game);
          alert("Partie terminée ! Tu as gagné " + coinsCollected + " pièce(s).");
          return;
        }

        const newHead = { x: headX, y: headY };

        if (headX === coin.x && headY === coin.y) {
          coinsCollected++;
          if (coinsCollected % 10 === 0) {
            hintTokens++;
          }
          coin = randomPosition();
          updateInfo();
        } else {
          snake.pop();
        }

        snake.unshift(newHead);

        drawBackground();
        drawCoin();
        drawSnake();
      }

      function changeDirection(event) {
        const key = event.key;
        if ((key === "ArrowLeft" || key === "q") && direction !== "RIGHT") direction = "LEFT";
        else if ((key === "ArrowUp" || key === "z") && direction !== "DOWN") direction = "UP";
        else if ((key === "ArrowRight" || key === "d") && direction !== "LEFT") direction = "RIGHT";
        else if ((key === "ArrowDown" || key === "s") && direction !== "UP") direction = "DOWN";
      }

      document.onkeydown = changeDirection;

      drawBackground();
      drawCoin();
      drawSnake();
      updateInfo();

      const game = setInterval(moveSnake, 130);
    }

    showHome();
  </script>
</body>
</html>
